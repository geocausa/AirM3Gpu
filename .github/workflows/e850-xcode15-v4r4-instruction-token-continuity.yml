name: E850 Xcode15.4 v4r4 instruction-token continuity

on:
  push:
    branches:
      - e850-xcode15-v4r4-instruction-token-continuity
    paths:
      - '.github/workflows/e850-xcode15-v4r4-instruction-token-continuity.yml'
      - 'ci/e850_parser_vtable.c'

permissions:
  contents: read

jobs:
  continuity:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Recover Sonoma-era v4r4 instruction-trace parser evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          XCODE=/Applications/Xcode_15.4.app
          BIN="$XCODE/Contents/PlugIns/GPUDebugger.ideplugin/Contents/Frameworks/GTShaderProfiler.framework/Versions/A/GTShaderProfiler"
          test -f "$BIN"
          sudo rm -f /Applications/Xcode.app
          sudo ln -s "$XCODE" /Applications/Xcode.app
          {
            DEVELOPER_DIR="$XCODE/Contents/Developer" xcodebuild -version
            shasum -a 256 "$BIN"
            file "$BIN"
            dwarfdump --uuid "$BIN" || true
          } > out/meta.txt
          nm -gU "$BIN" > out/nm.txt || true
          strings -a "$BIN" > out/strings.txt
          PAT='agxps_aps_(profile_data_get_(work|esl|hw)_clique_instruction_trace|clique_instruction_trace_get_(pc_advances|pc_advances_num|pc_advance_reasons|pc_advance_reasons_num|init_pcs|init_pcs_num|thread_execution_changes|thread_execution_changes_num|timestamp_references|timestamp_references_num|execution_events|execution_events_num|instruction_stats)|clique_advance_reason_get_string)'
          grep -E "$PAT" out/nm.txt > out/trace-api.txt || true
          grep -Ei 'AGXPSAPSParserGen1|clique|instruction trace|init[_ ]?pc|pc[_ ]?advance|advance reason|execution event|shader profiler' out/strings.txt > out/trace-strings.txt || true

          clang -Wall -Wextra -O0 ci/e850_parser_vtable.c -o out/e850_parser_vtable
          out/e850_parser_vtable > out/vtable.txt 2> out/vtable.err
          python3 - <<'PY'
          import re
          from pathlib import Path
          t=Path('out/vtable.txt').read_text()
          m=re.search(r'^vt\[\s*0\]=.*?off=0x([0-9a-fA-F]+)',t,re.M)
          if not m: raise SystemExit('vt[0] offset missing')
          off=int(m.group(1),16)
          start=max(0,off-0x400)
          stop=off+0x14000
          Path('out/parser-range.txt').write_text(f'parse_impl_off=0x{off:x}\nstart=0x{start:x}\nstop=0x{stop:x}\n')
          PY
          START=$(awk -F= '/^start=/{print $2}' out/parser-range.txt)
          STOP=$(awk -F= '/^stop=/{print $2}' out/parser-range.txt)
          xcrun llvm-objdump --macho --disassemble --start-address="$START" --stop-address="$STOP" "$BIN" > out/parser-window.asm

          # Targeted exported getter bodies provide independently named vector layout.
          otool -tvV "$BIN" > out/full-disasm.txt
          python3 - <<'PY'
          import re
          from pathlib import Path
          nm=Path('out/nm.txt').read_text(errors='ignore').splitlines()
          dis=Path('out/full-disasm.txt').read_text(errors='ignore').splitlines()
          wanted=('clique_instruction_trace_get_pc_advances','clique_instruction_trace_get_pc_advance_reasons','clique_instruction_trace_get_init_pcs','clique_instruction_trace_get_thread_execution_changes','clique_instruction_trace_get_timestamp_references','clique_instruction_trace_get_execution_events')
          syms=[]
          for line in nm:
              m=re.match(r'([0-9a-fA-F]+)\s+.*\s(_?agxps_\S+)$',line.strip())
              if m and any(w in m.group(2) for w in wanted): syms.append((int(m.group(1),16),m.group(2)))
          out=[]
          for addr,name in syms:
              out.append(f'===== {name} @ 0x{addr:x} =====')
              hx=f'{addr:016x}'
              hit=next((i for i,l in enumerate(dis) if l.startswith(hx) or l.strip()==name+':'),None)
              if hit is None: out.append('NO_DISASM_MATCH'); continue
              out.extend(dis[max(0,hit-2):hit+40])
          Path('out/getter-disasm.txt').write_text('\n'.join(out)+'\n')
          PY

          # Surface instruction patterns relevant to E848 token-7/0 semantics without claiming identity.
          python3 - <<'PY'
          import re
          from pathlib import Path
          lines=Path('out/parser-window.asm').read_text(errors='ignore').splitlines()
          pats=[
            re.compile(r'ubfx.*#0x?5.*#0x?(2b|43)',re.I),
            re.compile(r'ubfx.*#5.*#43',re.I),
            re.compile(r'and.*#0x?1f',re.I),
            re.compile(r'(str|stur).*#0x?30',re.I),
            re.compile(r'(str|stur).*#0x?48',re.I),
          ]
          hits=[]
          for i,l in enumerate(lines):
              if any(p.search(l) for p in pats):
                  lo=max(0,i-18); hi=min(len(lines),i+32)
                  hits.append(f'===== hit line {i+1}: {l} =====\n'+'\n'.join(lines[lo:hi]))
          Path('out/token-signature-context.txt').write_text('\n\n'.join(hits)+'\n')
          PY
          rm -f out/e850_parser_vtable out/full-disasm.txt
          echo '=== metadata ==='; cat out/meta.txt
          echo '=== trace API ==='; cat out/trace-api.txt || true
          echo '=== parser/vtable ==='; cat out/parser-range.txt; cat out/vtable.txt
          echo '=== getter bodies ==='; cat out/getter-disasm.txt || true
          echo '=== token-signature contexts (first 500 lines) ==='; sed -n '1,500p' out/token-signature-context.txt || true

      - name: Upload E850 evidence
        uses: actions/upload-artifact@v4
        with:
          name: e850-xcode15.4-v4r4-instruction-token-continuity
          path: out/
          retention-days: 3
          if-no-files-found: error
