name: E848 Xcode16.3 v4r5 parser body

on:
  push:
    branches:
      - e848-xcode16-v4r5-decoder
    paths:
      - '.github/workflows/e848-xcode16-v4r5-parser-body.yml'
      - 'ci/e848_parser_vtable.c'

permissions:
  contents: read

jobs:
  parser:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Recover live v4r5 parser implementation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          XCODE=/Applications/Xcode_16.3.app
          BIN="$XCODE/Contents/PlugIns/GPUDebugger.ideplugin/Contents/Frameworks/GTShaderProfiler.framework/Versions/A/GTShaderProfiler"
          test -f "$BIN"
          sudo rm -f /Applications/Xcode.app
          sudo ln -s "$XCODE" /Applications/Xcode.app
          clang -Wall -Wextra -O0 ci/e848_parser_vtable.c -o out/e848_parser_vtable
          out/e848_parser_vtable > out/vtable.txt 2> out/vtable.err
          python3 - <<'PY'
          import re
          from pathlib import Path
          t=Path('out/vtable.txt').read_text()
          m=re.search(r'^vt\[\s*0\]=.*?off=0x([0-9a-fA-F]+)',t,re.M)
          if not m: raise SystemExit('vt[0] offset missing')
          off=int(m.group(1),16)
          start=max(0,off-0x200)
          stop=off+0x12000
          Path('out/parser-range.txt').write_text(f'parse_impl_off=0x{off:x}\nstart=0x{start:x}\nstop=0x{stop:x}\n')
          PY
          START=$(awk -F= '/^start=/{print $2}' out/parser-range.txt)
          STOP=$(awk -F= '/^stop=/{print $2}' out/parser-range.txt)
          xcrun llvm-objdump --macho --disassemble --start-address="$START" --stop-address="$STOP" "$BIN" > out/parser-window.asm
          strings -a "$BIN" | grep -E 'AGXPSAPSParserGen1|tokenTypeIndex < numTokenTypes|chunkSize|cliqueStartSeen' > out/parser-strings.txt || true
          rm -f out/e848_parser_vtable
          echo '=== range ==='; cat out/parser-range.txt
          echo '=== vtable ==='; cat out/vtable.txt
          echo '=== window ==='; wc -l out/parser-window.asm
          echo '=== key strings ==='; cat out/parser-strings.txt
      - name: Upload parser body evidence
        uses: actions/upload-artifact@v4
        with:
          name: e848-xcode16.3-v4r5-parser-body
          path: out/
          retention-days: 3
          if-no-files-found: error
