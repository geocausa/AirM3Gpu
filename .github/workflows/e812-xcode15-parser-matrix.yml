name: E812 Xcode 15.4 parser construction matrix

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  matrix:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e812-xcode15-aps-oracle
      - name: Recover parser construction map
        shell: bash
        run: |
          set -euo pipefail
          XCODE=/Applications/Xcode_15.4.app
          BIN="$XCODE/Contents/PlugIns/GPUDebugger.ideplugin/Contents/Frameworks/GTShaderProfiler.framework/Versions/A/GTShaderProfiler"
          test -f "$BIN"
          sudo rm -f /Applications/Xcode.app
          sudo ln -s "$XCODE" /Applications/Xcode.app
          clang ci/e812_parser_matrix.c -o /tmp/e812_parser_matrix
          echo '=== parser matrix ==='
          /tmp/e812_parser_matrix
          echo '=== parser-create arm64 disassembly ==='
          lipo "$BIN" -thin arm64 -output /tmp/GTShaderProfiler.arm64
          xcrun llvm-objdump --disassemble-symbols=_agxps_aps_parser_create /tmp/GTShaderProfiler.arm64 2>/dev/null | head -220 || true
