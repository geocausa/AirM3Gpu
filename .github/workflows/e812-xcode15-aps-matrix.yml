name: E812 Xcode 15.4 APS support matrix

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  matrix:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e812-xcode15-aps-oracle
      - name: Probe Xcode 15.4 APS support matrix
        shell: bash
        run: |
          set -euo pipefail
          XCODE=/Applications/Xcode_15.4.app
          BIN="$XCODE/Contents/PlugIns/GPUDebugger.ideplugin/Contents/Frameworks/GTShaderProfiler.framework/Versions/A/GTShaderProfiler"
          test -f "$BIN"
          sudo rm -f /Applications/Xcode.app
          sudo ln -s "$XCODE" /Applications/Xcode.app
          echo '=== xcode ==='
          DEVELOPER_DIR="$XCODE/Contents/Developer" xcodebuild -version
          echo '=== descriptor metadata strings ==='
          strings -a "$BIN" | grep -E 'pulsePeriod|eraPeriod|countPeriod|chunkSize|counterUarchBehaviour|timebaseOffset|timestamp_sync_point_data' | head -80 || true
          echo '=== exported APS symbols ==='
          nm -gU "$BIN" 2>/dev/null | grep -E 'agxps_(aps|gpu)' | head -120 || true
          clang ci/e812_support_matrix.c -o /tmp/e812_support_matrix
          echo '=== support matrix ==='
          /tmp/e812_support_matrix
